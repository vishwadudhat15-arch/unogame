<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uno Pro | Premium Card Game</title>
  <meta name="description" content="A high-end, premium Uno game experience built with React and Framer Motion." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Grotesk:wght@500;700&display=swap"
    rel="stylesheet">
  <script>
    if (window.location.protocol === 'file:') {
      // Only run this loader interface if opened directly via file://
      const style = document.createElement('style');
      style.innerHTML = `
          body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #1c093a 0%, #080312 100%);
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-y: auto;
          }
          .container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 40px 30px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            box-sizing: border-box;
            margin: 20px 0;
          }
          .container::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 30px;
            background: linear-gradient(135deg, #ff3e3e, #f39c12, #27ae60, #2980b9);
            z-index: -1;
            opacity: 0.2;
            filter: blur(12px);
          }
          .logo {
            width: 110px;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 8px 24px rgba(255, 62, 62, 0.4));
            animation: float 4s ease-in-out infinite;
          }
          @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(1deg); }
          }
          h1 {
            font-size: 28px;
            font-weight: 900;
            margin: 0 0 8px 0;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
          }
          .subtitle {
            font-size: 13px;
            font-weight: 700;
            color: #f39c12;
            background: rgba(243, 156, 18, 0.1);
            border: 1px solid rgba(243, 156, 18, 0.25);
            padding: 4px 12px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 24px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
          }
          p {
            font-size: 15px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.75);
            margin: 0 0 28px 0;
          }
          .btn-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 28px;
          }
          .btn {
            display: block;
            width: 100%;
            padding: 15px;
            font-size: 15px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            border-radius: 14px;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-sizing: border-box;
            cursor: pointer;
          }
          .btn-primary {
            color: #ffffff;
            background: linear-gradient(135deg, #f39c12 0%, #d35400 100%);
            border: none;
            box-shadow: 0 8px 24px rgba(211, 84, 0, 0.35);
          }
          .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(211, 84, 0, 0.45);
          }
          .btn-secondary {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
          }
          .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
          }
          .info-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 18px;
            text-align: left;
            font-size: 13.5px;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.6);
          }
          .info-title {
            color: #ff3e3e;
            font-weight: 700;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 6px;
          }
        `;
      document.head.appendChild(style);

      document.addEventListener('DOMContentLoaded', () => {
        document.body.innerHTML = `
            <div class="container">
              <img src="https://upload.wikimedia.org/wikipedia/commons/f/f9/UNO_Logo.svg" alt="UNO Logo" class="logo" />
              <h1>Uno Pro Launcher</h1>
              <div class="subtitle">Arcade Setup</div>
              <p>Since this game is built with React and Vite, you can run it either offline as a built page or via a local development server.</p>
              
              <div class="btn-group">
                <a href="./dist/index.html" class="btn btn-primary">Play Game Offline</a>
                <a href="http://localhost:5178" target="_blank" class="btn btn-secondary">Open Local Dev Server</a>
              </div>
              
              <div class="info-box">
                <div class="info-title">Need to compile or start server?</div>
                Double-click <b>PlayGame.bat</b> in this folder. It will install all files, build the offline version, and launch the dev server automatically.
              </div>
            </div>
          `;
      });
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
